# Dead keys (~, ´, `) on Wayland.
# GTK 4.20+ no longer composes dead keys itself and delegates to an input
# method. Without IBus/Fcitx running, those keys are dropped by Ghostty.
# `simple` restores GTK's built-in composition.
# See https://github.com/ghostty-org/ghostty/issues/8899
GTK_IM_MODULE=simple
